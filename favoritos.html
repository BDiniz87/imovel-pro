<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favoritos | ImóvelPro</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/pages/favorites.css">
    <link rel="stylesheet" href="css/components/demoDialog.css">
    <link rel="stylesheet" href="css/components/footer.css">
</head>
<body>

    <header class="header">
        <div class="container header-container">
            <a href="index.html" class="logo">
                Imóvel <span>Pro</span>
            </a>

            <button
                class="menu-toggle"
                id="menu-toggle"
                aria-label="Abrir menu"
                aria-expanded="false"
            >
                ☰
            </button>

            <nav class="nav" id="nav">
                <a href="index.html" class="nav-link">Início</a>
                <a href="imoveis.html?finalidade=venda" class="nav-link">Comprar</a>
                <a href="imoveis.html?finalidade=aluguel" class="nav-link">Alugar</a>
                <a href="sobre.html" class="nav-link">Sobre</a>
                <a href="contato.html" class="nav-link">Contato</a>
                <a
                    href="favoritos.html"
                    class="favorites-link"
                    aria-label="Ver favoritos"
                    title="Ver favoritos"
                >
                    <span class="favorites-icon" aria-hidden="true">
                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78Z"/>
                        </svg>
                    </span>
                    <span class="favorites-text">Favoritos</span>
                    <span class="favorites-count" id="favorites-count" aria-hidden="true">0</span>
                </a>

                <button
                    class="theme-toggle"
                    id="theme-toggle"
                    aria-label="Alternar tema"
                >
                    🌙
                </button>

            </nav>

        </div>

    </header>   

    <main class="container favorites-page">
        <header class="favorites-header">
            <h1>Meus favoritos</h1>
            <p>Confira os imóveis que você salvou.</p>
        </header>

        <section
            id="favorites-grid"
            class="properties-grid"
            aria-label="Imóveis favoritos"
        ></section>
    </main>

    <footer id="site-footer" class="site-footer"></footer>

    <script type="module" src="js/pages/favoritesPage.js"></script>
</body>
</html>
