<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ImóvelPro | Encontre seu próximo imóvel</title>
    <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components/footer.css">
    <link rel="stylesheet" href="css/components/demoDialog.css">
</head>
<body>
    <header class="header">
        <div class="container header-container">
            <a href="index.html" class="logo">
                Imóvel <span>Pro</span>
            </a>

            <button
                class="menu-toggle"
                id="menu-toggle"
                aria-label="Abrir menu"
                aria-expanded="false"
            >
                ☰
            </button>

            <nav class="nav" id="nav">
                <a href="index.html" class="nav-link active">Início</a>
                <a href="imoveis.html?finalidade=venda" class="nav-link">Comprar</a>
                <a href="imoveis.html?finalidade=aluguel" class="nav-link">Alugar</a>
                <a href="sobre.html" class="nav-link">Sobre</a>
                <a href="contato.html" class="nav-link">Contato</a>
                <a
                    href="favoritos.html"
                    class="favorites-link"
                    aria-label="Ver favoritos"
                    title="Ver favoritos"
                >
                    <span class="favorites-icon" aria-hidden="true">
                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78Z"/>
                        </svg>
                    </span>
                    <span class="favorites-text">Favoritos</span>
                    <span class="favorites-count" id="favorites-count" aria-hidden="true">0</span>
                </a>

                <button
                    class="theme-toggle"
                    id="theme-toggle"
                    aria-label="Alternar tema"
                >
                    🌙
                </button>

            </nav>

        </div>

    </header>

    <main>
        <section class="hero">

            <div class="hero-overlay"></div>

            <div class="container hero-content">

                <div class="hero-text">

                    <h1>
                        Encontre o imóvel<br>
                        ideal para você
                    </h1>

                    <p>
                        Casas, apartamentos e terrenos selecionados
                        para você encontrar o lugar perfeito.
                    </p>

                </div>

                <form class="search-box" id="search-form">

                    <div class="search-purpose">

                        <button
                            type="button"
                            class="purpose-button active"
                            data-purpose="venda"
                        >
                            Comprar
                        </button>

                        <button
                            type="button"
                            class="purpose-button"
                            data-purpose="aluguel"
                        >
                            Alugar
                        </button>

                    </div>

                    <div class="search-fields">

                        <div class="search-field">

                            <label for="property-type">
                                Tipo de Imóvel
                            </label>

                            <select id="property-type">
                                <option value="">Todos</option>
                                <option value="casa">Casa</option>
                                <option value="apartamento">Apartamento</option>
                                <option value="terreno">Terreno</option>
                            </select>

                        </div>

                        <div class="search-field">

                            <label for="city">
                                Cidade
                            </label>

                            <select id="city">
                                <option value="">Todas</option>
                            </select>

                        </div>

                        <div class="search-field">

                            <label for="neighborhood">
                                Bairro
                            </label>

                            <select id="neighborhood">
                                <option value="">Todos</option>
                            </select>

                        </div>

                        <div class="search-field price-field">

                            <div class="price-header">

                                <label for="price">
                                    Preço Máximo
                                </label>

                                <span id="price-value">
                                    R$ 3.000.000
                                </span>

                            </div>

                            <input 
                                type="range"
                                id="price"
                                min="100000"
                                max="3000000"
                                step="50000"
                                value="3000000"
                            >

                        </div>

                        <button
                            type="submit"
                            class="search-button"
                        >
                            Buscar
                        </button>

                    </div>

                </form>

            </div>

        </section>

        <section class="featured-properties">

            <div class="container">

                <div class="section-header">

                    <div>
                        <h2 id ="properties-title">Imóveis em destaque</h2>

                        <p id="properties-description">
                            Confira algumas das melhores
                            oportunidades disponíveis.
                        </p>
                    </div>
                    <div class="section-actions">

                        <div class="sort-container">

                            <label for="sort-properties">
                                Ordenar por:
                            </label>

                            <select id="sort-properties">
                                <option value="default">Padrão</option>
                                <option value="price-asc">Menor preço</option>
                                <option value="price-desc">Maior preço</option>
                            </select>

                        </div>

                        <button
                            type="button"
                            class="clear-filters"
                            id="clear-filters"
                            hidden
                        >
                            Limpar filtros
                        </button>

                        <a href="imoveis.html" class="view-all">
                            Ver todos os imóveis →
                        </a>

                    </div>

                </div>

                <div
                    class="properties-grid"
                    id="featured-properties"
                >
                </div>

                <div class="pagination" id="pagination">

                    <button
                        type="button"
                        class="pagination-button"
                        id="previous-page"
                    >
                        Anterior
                    </button>

                    <div
                        class="pagination-pages"
                        id="pagination-pages"
                    >
                    </div>

                    <button
                        type="button"
                        class="pagination-button"
                        id="next-page"
                    >
                        Próxima
                    </button>

                </div>

            </div>

        </section>
        
    </main>

    <footer id="site-footer" class="site-footer"></footer>

    <script type="module" src="js/pages/home.js"></script>
</body>
</html>
