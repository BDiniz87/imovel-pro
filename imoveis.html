<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imóveis à venda e para alugar | ImóvelPro</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/pages/listings.css">
</head>
<body>

    <header class="header">
        <div class="container header-container">
            <a href="index.html" class="logo">
                Imóvel <span>Pro</span>
            </a>

            <button
                class="menu-toggle"
                id="menu-toggle"
                aria-label="Abrir menu"
                aria-expanded="false"
            >
                ☰
            </button>

            <nav class="nav" id="nav">
                <a href="index.html" class="nav-link">Início</a>
                <a href="#" class="nav-link">Comprar</a>
                <a href="#" class="nav-link">Alugar</a>
                <a href="imoveis.html" class="nav-link active">Imóveis</a>
                <a href="#" class="nav-link">Sobre</a>
                <a href="#" class="nav-link">Contato</a>
                <a
                    href="favoritos.html"
                    class="favorites-link"
                    aria-label="Ver favoritos"
                    title="Ver favoritos"
                >
                    <span class="favorites-icon" aria-hidden="true">♡</span>
                    <span class="favorites-text">Favoritos</span>
                    <span class="favorites-count" id="favorites-count" aria-hidden="true">0</span>
                </a>

                <button
                    class="theme-toggle"
                    id="theme-toggle"
                    aria-label="Alternar tema"
                >
                    🌙
                </button>

            </nav>

        </div>

    </header>   

    <main>

        <section class="listings-intro">

            <div class="container">

                <h1>Todos os imóveis</h1>

                <p>Confira nossa seleção de imóveis</p>

            </div>

        </section>

        <section class="listings-section">

            <div class="container">

                <div class="listings-layout">

                    <aside class="listings-filters">

                        <h2>Filtrar imóveis</h2>

                        <form id="listings-filter-form">

                            <div class="search-field">
                                <label for="listing-purpose">Finalidade</label>

                                <select id="listing-purpose" name="purpose">
                                    <option value="venda">Comprar</option>
                                    <option value="aluguel">Alugar</option>
                                </select>
                            </div>

                            <div class="search-field">
                                <label for="listing-type">Tipo de imóvel</label>

                                <select id="listing-type" name="type">
                                    <option value="">Todos os tipos</option>
                                    <option value="casa">Casa</option>
                                    <option value="apartamento">Apartamento</option>
                                    <option value="terreno">Terreno</option>
                                </select>
                            </div>

                            <div class="search-field">
                                <label for="listing-city">Cidade</label>
                                <select id="listing-city" name="city">
                                    <option value="">Todas as cidades</option>
                                </select>
                            </div>

                            <div class="search-field">
                                <label for="listing-neighborhood">Bairro</label>
                                <select id="listing-neighborhood" name="neighborhood">
                                    <option value="">Todos os bairros</option>
                                </select>
                            </div>

                            <div class="search-field">
                                <label for="listing-price">Preço máximo</label>

                                <input
                                    type="range"
                                    id="listing-price"
                                    name="price"
                                    min="100000"
                                    max="3000000"
                                    step="50000"
                                    value="3000000"
                                >

                                <output id="listing-price-value" for="listing-price"></output>
                            </div>

                            <button type="submit" class="search-button">
                                Buscar imóveis
                            </button>

                            <button type="button" id="clear-listings-filters" class="clear-filters-button">
                                Limpar filtros
                            </button>

                        </form>

                    </aside>

                    <div class="listings-results">
                        <h2>Imóveis disponíveis</h2>
                        <div class="listings-sort">
                            <label for="listing-sort">Ordenar por:</label>

                            <select id="listing-sort">
                                <option value="default">Mais recentes</option>
                                <option value="price-asc">Menor preço</option>
                                <option value="price-desc">Maior preço</option>
                            </select>
                        </div>

                        <div class="properties-grid" id="listings-grid"></div>
                        
                        <div class="pagination" id="pagination" hidden>
                            <button
                                type="button"
                                class="pagination-button"
                                id="previous-page"
                                aria-label="Página anterior"
                            >
                                Anterior
                            </button>

                            <div class="pagination-pages" id="pagination-pages"></div>

                            <button
                                type="button"
                                class="pagination-button"
                                id="next-page"
                                aria-label="Próxima página"
                            >
                                Próxima
                            </button>
                        </div>
                    </div>

                </div>

            </div>

        </section>

    </main>

    <script type="module" src="js/pages/listings.js"></script>
</body>
</html>
